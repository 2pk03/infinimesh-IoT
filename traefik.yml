api:
  insecure: true
  dashboard: true
accessLog: {}
providers:
  docker:
    exposedByDefault: false
entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: ":443"
  grpc:
    address: ":8000"

certificatesResolvers:
  letsencrypt:
    acme:
      tlsChallenge: {}
      # Update this email for ACME registration
      email: "admin@example.com"
      storage: /etc/traefik/acme/acme.json
      caServer: "https://acme-v02.api.letsencrypt.org/directory"

# log:
#   level: DEBUG
